name: Build MyCoder EXE - Final Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - run: pyinstaller --onefile --noconsole --name MyCoder main.py
    - uses: actions/upload-artifact@v4
      with:
        name: MyCoder-v1.0-by-Masum-Billah
        path: dist/MyCoder.exe
        retention-days: 30
